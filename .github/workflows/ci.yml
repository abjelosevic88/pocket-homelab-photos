name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Verify pinned Core SDK
        run: cd third_party/pocket-core && sha256sum -c SHA256SUMS
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-photos ./cmd/pocket-photos
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pt ./pocket-photos &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/immich/assets/statistics)" = 401
      - name: Browser suite (fixture library, no live services)
        run: |
          cd web && npx playwright install --with-deps chromium && cd ..
          npm run preview --prefix web -- --host 127.0.0.1 --port 18194 > /tmp/preview.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18194/ > /dev/null && break; sleep 1; done
          node scripts/e2e.mjs
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-photos:pr
